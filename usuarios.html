<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Usuarios | SOCA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./css/global.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" href="/assets/favi.ico" type="image/x-icon">
</head>

<body>
    <div class="app">
        <!-- Botón hamburguesa -->
        <button class="menu-toggle" id="menuToggle">
            <i class="fas fa-bars"></i>
        </button>
        <div class="sidebar-overlay hidden" id="sidebarOverlay"></div>

        <aside class="sidebar" id="sidebar">
            <div class="logo-container">
                <img src="./assets/logo.png" alt="SOCA">
                <h1>SOCA</h1>
                <p>Galería de Arte</p>
            </div>
            <nav>
                <a href="dashboard.html"><i class="fas fa-chart-line"></i> <span>Dashboard</span></a>
                <a href="pedidos.html"><i class="fas fa-shopping-cart"></i> <span>Pedidos</span></a>
                <a href="usuarios.html" class="active"><i class="fas fa-users"></i> <span>Usuarios</span></a>
            </nav>
        </aside>

        <main class="content">
            <header class="topbar">
                <div class="topbar-left">
                    <div>
                        <h2><i class="fas fa-users"></i> Usuarios</h2>
                        <p>Gestión de usuarios del sistema</p>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="notificaciones-icono" id="notificacionesIcono">
                        <i class="fas fa-bell"></i>
                        <span class="notificaciones-badge" style="display:none">0</span>
                    </div>
                    <button id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                    </button>
                </div>
            </header>

            <div id="usuariosContainer" class="usuarios-container"></div>
        </main>
    </div>

    <script type="module" src="./js/usuarios.js"></script>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('hidden');
        }

        if (menuToggle) menuToggle.addEventListener('click', toggleSidebar);
        if (overlay) overlay.addEventListener('click', toggleSidebar);
    </script>
</body>

</html>
