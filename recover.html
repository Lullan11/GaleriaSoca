<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Recuperar contraseña</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/login.css">

</head>
<body>

  <div class="login-container">

    <div class="login-card">

      <h1 class="soca-title">SOCA</h1>

      <p>Recuperar contraseña</p>

      <form id="recoverForm">

        <input
          type="email"
          id="recoverEmail"
          placeholder="Correo"
          required
        >

        <button type="submit">
          Enviar enlace
        </button>

      </form>

      <div id="message" class="message"></div>

      <a 
        href="index.html" 
        id="backButton"
        class="back-button"
      >
        Volver al login
      </a>

    </div>

  </div>

  <script type="module" src="./js/recover.js"></script>

</body>
</html>
