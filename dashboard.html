<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

    <title>SOCA | Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">

    <!-- Cloudinary -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="icon" href="/assets/favi.ico" type="image/x-icon">
</head>

<body>

    <div class="app">
        <!-- Botón hamburguesa para móvil -->
        <button class="menu-toggle" id="menuToggle">
            <i class="fas fa-bars"></i>
        </button>

        <!-- Overlay para cerrar sidebar en móvil -->
        <div class="sidebar-overlay hidden" id="sidebarOverlay"></div>

        <aside class="sidebar" id="sidebar">
            <div class="logo-container">
                <img src="./assets/logo.png" alt="SOCA">
                <h1>SOCA</h1>
                <p>Galería de Arte</p>
            </div>

            <nav>
                <a href="dashboard.html" class="active"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="pedidos.html"><i class="fas fa-shopping-cart"></i> Pedidos</a>
                <a href="usuarios.html"><i class="fas fa-users"></i> Usuarios</a>
            </nav>
        </aside>

        <main class="content">
            <header class="topbar">
                <div class="topbar-left">
                    <div>
                        <h2><i class="fas fa-chart-line"></i> Dashboard</h2>
                        <p id="userName"></p>
                    </div>
                </div>
                <div class="topbar-right">

                    <button id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                    </button>
                </div>
            </header>

            <!-- Estadísticas -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-clipboard-list"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Pedidos activos</h3>
                        <p id="pedidosActivos">0</p>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-truck"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Entregas hoy</h3>
                        <p id="entregasHoy">0</p>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-dollar-sign"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Ingresos totales</h3>
                        <p id="ingresosTotales">$0</p>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script type="module" src="js/dashboard.js"></script>

    <!-- Script para el menú hamburguesa -->
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('hidden');
        }

        menuToggle.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);
    </script>
</body>

</html>
