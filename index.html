<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SOCA Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/login.css">
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>

    <!-- Agrega esto en el <head> de cada página, después de los estilos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/main.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/main.min.js'></script>
    <link rel="icon" href="/assets/favi.ico" type="image/x-icon">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <img src="./assets/logo.png" alt="SOCA">

            <h1>SOCA</h1>

            <p>Galería de Arte</p>

            <form id="loginForm">

                <input type="email" id="email" placeholder="Correo" required>

                <div class="password-container">

                    <input type="password" id="password" placeholder="Contraseña" required>

                    <span id="togglePassword">
                        👁
                    </span>

                </div>
                <button type="submit">
                    Ingresar
                </button>

                <div id="message" class="message"></div>

                <a href="recover.html" class="recover-link">
                    ¿Olvidaste tu contraseña?
                </a>

            </form>

        </div>

    </div>

    <script type="module" src="./js/auth.js"></script>

</body>

</html>
