<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Pedidos | SOCA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/global.css">

    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" href="/assets/favi.ico" type="image/x-icon">
</head>

<body>
    <div class="app">
        <button class="menu-toggle" id="menuToggle">
            <i class="fas fa-bars"></i>
        </button>
        <div class="sidebar-overlay hidden" id="sidebarOverlay"></div>

        <aside class="sidebar" id="sidebar">
            <div class="logo-container">
                <img src="./assets/logo.png" alt="SOCA">
                <h1>SOCA</h1>
                <p>Galería de Arte</p>
            </div>
            <nav>
                <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="pedidos.html" class="active"><i class="fas fa-shopping-cart"></i> Pedidos</a>
                <a href="usuarios.html"><i class="fas fa-users"></i> Usuarios</a>
            </nav>
        </aside>

        <main class="content">
            <header class="topbar">
                <div class="topbar-left">
                    <div>
                        <h2><i class="fas fa-shopping-cart"></i> Pedidos</h2>
                        <p>Gestiona todos los pedidos de la galería</p>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="notificaciones-icono" id="notificacionesIcono">
                        <i class="fas fa-bell"></i>
                        <span class="notificaciones-badge" style="display:none">0</span>
                    </div>
                    <button id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                    </button>
                </div>
            </header>

            <!-- Botones para cambiar entre módulos -->
            <div class="modulos-tabs">
                <button id="btnFormulario" class="modulo-btn active">
                    <i class="fas fa-plus-circle"></i> Nuevo Pedido
                </button>
                <button id="btnLista" class="modulo-btn">
                    <i class="fas fa-list"></i> Lista de Pedidos
                </button>
            </div>

            <!-- MÓDULO FORMULARIO -->
            <section id="moduloFormulario" class="modulo-content active">
                <div class="form-section">
                    <div class="form-header">
                        <h3><i class="fas fa-plus-circle"></i> Crear nuevo pedido</h3>
                        <span class="form-badge"><i class="fas fa-info-circle"></i> Campos con * son obligatorios</span>
                    </div>

                    <form id="pedidoForm">
                        <div class="grid">
                            <div class="input-group">
                                <i class="fas fa-user input-icon"></i>
                                <input type="text" id="cliente" placeholder="Cliente *" required>
                            </div>
                            <div class="input-group">
                                <i class="fab fa-whatsapp input-icon"></i>
                                <input type="text" id="telefono" placeholder="Teléfono">
                            </div>
                            <div class="input-group">
                                <i class="fas fa-palette input-icon"></i>
                                <input type="text" id="tipoArte" placeholder="Tipo de arte *" required>
                            </div>
                            <div class="input-group">
                                <i class="fas fa-dollar-sign input-icon"></i>
                                <input type="number" id="precio" placeholder="Precio">
                            </div>
                            <div class="input-group">
                                <i class="fas fa-money-bill-wave input-icon"></i>
                                <input type="number" id="adelanto" placeholder="Adelanto">
                            </div>
                            <div class="input-group">
                                <i class="fas fa-calendar-alt input-icon"></i>
                                <input type="date" id="fechaEntrega">
                            </div>
                            <div class="input-group">
                                <i class="fas fa-tag input-icon"></i>
                                <select id="estado">
                                    <option value="Pendiente">📋 Pendiente</option>
                                    <option value="Diseñando">🎨 Diseñando</option>
                                    <option value="Listo">✅ Listo</option>
                                    <option value="Entregado">🚚 Entregado</option>
                                    <option value="Cancelado">❌ Cancelado</option>
                                </select>
                            </div>
                        </div>

                        <div class="input-group full-width">
                            <i class="fas fa-align-left input-icon"></i>
                            <textarea id="descripcion" placeholder="Descripción del pedido"></textarea>
                        </div>

                        <div class="input-group full-width">
                            <i class="fas fa-sticky-note input-icon"></i>
                            <textarea id="observaciones" placeholder="Observaciones adicionales"></textarea>
                        </div>

                        <label class="upload-label">
                            <i class="fas fa-images"></i> Referencias e imágenes (click para subir)
                            <input type="file" id="imagenes" multiple accept="image/*">
                        </label>

                        <div id="previewContainer" class="preview-container"></div>

                        <button type="submit" id="submitBtn">
                            <i class="fas fa-save"></i> Guardar pedido
                        </button>
                    </form>
                </div>
            </section>

            <!-- MÓDULO LISTA DE PEDIDOS -->
            <section id="moduloLista" class="modulo-content">
                <div class="lista-section">
                    <div class="lista-header">
                        <h3><i class="fas fa-list"></i> Todos los pedidos</h3>
                        <div class="pedidos-filtros">
                            <div class="search-box">
                                <i class="fas fa-search"></i>
                                <input type="text" id="searchPedido" placeholder="Buscar por cliente...">
                            </div>
                            <select id="filterEstado" class="filter-select">
                                <option value="todos">📊 Todos los estados</option>
                                <option value="Pendiente">📋 Pendiente</option>
                                <option value="Diseñando">🎨 Diseñando</option>
                                <option value="Listo">✅ Listo</option>
                                <option value="Entregado">🚚 Entregado</option>
                                <option value="Cancelado">❌ Cancelado</option>
                            </select>
                        </div>
                    </div>

                    <div id="pedidosContainer" class="pedidos-grid"></div>
                    <div id="paginacionPedidos" class="paginacion-container"></div>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="./js/pedidos.js"></script>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('hidden');
        }

        if (menuToggle) menuToggle.addEventListener('click', toggleSidebar);
        if (overlay) overlay.addEventListener('click', toggleSidebar);
    </script>
</body>

</html>
